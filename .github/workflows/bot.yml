name: Kun o'qituvchisi bot

on:
  schedule:
    - cron: "7 * * * *"      # har soat tekshiradi; bot bitta ishga ~5,7 soat ishlaydi
  workflow_dispatch:

permissions:
  contents: write
  actions: write     # keyingi navbatni özi band qiladi

concurrency:
  group: bot
  cancel-in-progress: false   # oldingisi tugashi bilan keyingisi darhol boshlanadi

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      # Keyingi navbat şu zahoti band qilinadi: u kutib turadi va bu navbat tugaşi bilan darhol boşlanadi.
      # (GitHub "schedule" kafolatlanmagan — keçikadi yoki tuşib qoladi; bu esa zaxira.)
      - name: Keyingi navbatni band qiliş
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main -R "${{ github.repository }}" || echo "band qilib bölmadi — zaxira cron işlaydi"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Botni ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          RUN_SECONDS: "20400"
          GIT_SYNC: "1"
        run: |
          git config user.name "kun-oqituvchisi-bot"
          git config user.email "bot@users.noreply.github.com"
          python -u bot.py
