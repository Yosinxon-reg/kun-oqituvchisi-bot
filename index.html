<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kun öqituvçilari — Registan School</title>
<meta name="description" content="«Kun öqituvçisi» taşakkurnomalari — Registon va Turkiston taʼlim loyihalari">
<meta name="theme-color" content="#3955A1">
<link rel="icon" href="assets/registon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#3955A1;--dark:#1B2340;--yel:#F6B306;--grn:#0D6D59;--bg:#F4F6FB;--card:#fff;--mut:#5B6488;--line:#E3E8F4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--dark);font-family:Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{background:var(--blue);color:#fff;position:relative;overflow:hidden}
header .leafbg{position:absolute;right:-60px;bottom:-70px;width:340px;opacity:.10}
.top{display:flex;align-items:center;gap:12px;padding:18px 0}
.top img{width:40px}
.top .t1{font:800 13px/1 Montserrat;letter-spacing:.06em}
.top .t2{font:500 11px/1.4 Montserrat;opacity:.8}
.hero{padding:26px 0 34px;position:relative}
.bar{width:56px;height:5px;background:var(--yel);margin-bottom:18px}
.hero h1{font:300 34px/1.08 Montserrat}
.hero h1 b{font-weight:800;display:block;letter-spacing:.01em}
.hero p{font:500 14px/1.5 Montserrat;opacity:.85;margin-top:12px;max-width:520px}
.stats{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.12);border-radius:16px;padding:12px 16px;min-width:96px}
.stat b{display:block;font:800 26px/1 Montserrat}
.stat span{font:500 11px/1.3 Montserrat;opacity:.85}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 8px}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:0 16px;height:52px;box-shadow:0 6px 20px rgba(27,35,64,.06);border:1px solid var(--line)}
.search input{flex:1;border:0;outline:0;font:500 16px Montserrat;color:var(--dark);background:transparent;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:600 13px Montserrat;color:var(--mut);cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.day{font:700 12px/1 Montserrat;letter-spacing:.12em;color:var(--blue);text-transform:uppercase;margin:22px 0 12px;display:flex;align-items:center;gap:10px}
.day:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.item{display:flex;gap:14px;background:#fff;border-radius:18px;padding:12px;box-shadow:0 6px 20px rgba(27,35,64,.05);border:1px solid var(--line);transition:transform .15s}
.item:active{transform:scale(.98)}
.item img{width:112px;height:79px;object-fit:cover;border-radius:10px;flex:none;background:var(--line)}
.item .nm{font:700 15px/1.25 Montserrat}
.item .mt{font:500 12px/1.45 Montserrat;color:var(--mut);margin-top:4px}
.item .no{font:600 11px/1 Montserrat;color:var(--blue);margin-top:8px;letter-spacing:.05em}
.empty{text-align:center;color:var(--mut);font:500 15px/1.5 Montserrat;padding:50px 0}
footer{text-align:center;color:var(--mut);font:500 12px/1.6 Montserrat;padding:40px 16px 50px}
/* ---- taşakkurnoma sahifasi ---- */
.cert{padding:18px 0 10px}
.badge{display:inline-flex;align-items:center;gap:8px;background:#E7F3EF;color:var(--grn);border-radius:999px;padding:9px 14px;font:700 13px/1.2 Montserrat}
.cname{font:800 32px/1.1 Montserrat;margin:16px 0 6px;letter-spacing:.005em}
.cmeta{font:500 15px/1.5 Montserrat;color:var(--mut)}
.cmeta b{color:var(--blue)}
.shot{margin-top:18px;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(27,35,64,.16);background:#fff}
.shot img{width:100%;display:block}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;font:700 14px Montserrat;border:0;cursor:pointer;background:#fff;color:var(--blue);box-shadow:0 4px 14px rgba(27,35,64,.06);border:1px solid var(--line)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.wide{grid-column:1/-1}
.back{display:inline-flex;align-items:center;gap:6px;font:600 13px Montserrat;color:#fff;opacity:.9}
/* ---- tabrik ---- */
#gift{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 90% at 50% 30%,#4A67B5 0%,#3955A1 45%,#1B2340 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .7s ease}
#gift.hide{opacity:0;pointer-events:none}
.orb{position:relative;width:190px;height:190px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px rgba(255,255,255,.12),0 0 0 30px rgba(255,255,255,.06),0 30px 80px rgba(0,0,0,.35);animation:pulse 1.6s ease-in-out infinite}
.orb img{width:118px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#gift .k{font:700 12px/1 Montserrat;letter-spacing:.24em;color:var(--yel);margin-top:44px}
#gift h2{font:300 30px/1.15 Montserrat;margin-top:12px}
#gift h2 b{font-weight:800;display:block}
#gift .open{margin-top:30px;height:60px;padding:0 34px;border-radius:999px;border:0;background:var(--yel);color:var(--dark);font:800 17px Montserrat;cursor:pointer;box-shadow:0 14px 30px rgba(246,179,6,.35);animation:nudge 2.2s ease-in-out infinite}
@keyframes nudge{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(-6px)}94%{transform:translateY(2px)}}
#gift .hint{font:500 12px/1.4 Montserrat;opacity:.7;margin-top:14px}
.boom .orb{animation:boom .55s cubic-bezier(.2,.9,.3,1.4) forwards}
@keyframes boom{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(0);opacity:0}}
.leafp{position:fixed;z-index:60;width:46px;height:34px;left:50%;top:42%;pointer-events:none;will-change:transform,opacity}
#fx{position:fixed;inset:0;z-index:55;pointer-events:none}
.ring{position:fixed;left:50%;top:42%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:6px solid var(--yel);z-index:58;pointer-events:none;animation:ring .9s ease-out forwards}
@keyframes ring{to{transform:scale(40);opacity:0;border-width:1px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;border-radius:12px;padding:12px 16px;font:600 13px Montserrat;z-index:70;opacity:0;transition:opacity .3s}
.toast.on{opacity:1}

/* ---- v2: hayratlanarli oçiliş, izoh, QR, video ---- */
#gift{background:radial-gradient(120% 90% at 50% 34%,#2C4590 0%,#1B2340 58%,#0E1428 100%);overflow:hidden}
#gift .rays{position:absolute;left:50%;top:34%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;
  background:repeating-conic-gradient(from 0deg,rgba(246,179,6,.16) 0deg 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#gift .spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#FFE7A3;box-shadow:0 0 10px 2px rgba(246,179,6,.8);animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.4)}}
#gift .orb{box-shadow:0 0 0 14px rgba(246,179,6,.14),0 0 0 32px rgba(246,179,6,.06),0 0 90px 20px rgba(246,179,6,.35);z-index:1}
#gift .k,#gift h2,#gift .open,#gift .hint{position:relative;z-index:1}
#gift h2 b{background:linear-gradient(90deg,#fff,#FFE7A3,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.flash{position:fixed;inset:0;background:#fff;z-index:65;pointer-events:none;animation:flash .9s ease-out forwards}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.reveal .shot{animation:rise 1.4s cubic-bezier(.18,.9,.25,1) both .25s}
@keyframes rise{0%{transform:translateY(70px) scale(.86) rotate(-3deg);opacity:0;box-shadow:0 0 0 rgba(246,179,6,0)}
  60%{box-shadow:0 0 70px 10px rgba(246,179,6,.55)}100%{transform:none;opacity:1}}
.cname span{display:inline-block;opacity:0;transform:translateY(14px);animation:ch .5s ease forwards}
@keyframes ch{to{opacity:1;transform:none}}
.unvon{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font:700 13px/1.3 Montserrat;color:var(--dark)}
.unvon .st{color:var(--yel);letter-spacing:2px;font-size:16px}
.note{margin-top:18px;background:#fff;border-radius:18px;padding:18px 18px 16px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(27,35,64,.07);position:relative}
.note:before{content:"";position:absolute;left:28px;top:-9px;width:18px;height:18px;background:#fff;border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.note .who{display:flex;align-items:center;gap:10px;font:700 13px/1.2 Montserrat;color:var(--blue)}
.note .who img{width:34px;height:34px;border-radius:50%;background:var(--blue);padding:7px}
.note .who small{display:block;font:500 11px Montserrat;color:var(--mut);margin-top:2px}
.note p{font:500 16px/1.6 Montserrat;margin-top:12px;min-height:3.2em;white-space:pre-wrap}
.note .sig{font:600 12px Montserrat;color:var(--mut);margin-top:8px;text-align:right}
.caret:after{content:"▍";color:var(--blue);animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.qrsec{margin-top:26px;background:radial-gradient(110% 90% at 50% 40%,#2C4590,#1B2340 70%);border-radius:22px;padding:34px 18px 26px;text-align:center;color:#fff;position:relative;overflow:hidden}
.qrsec .burst{position:absolute;left:50%;top:46%;width:760px;height:760px;margin:-380px 0 0 -380px;
  background:repeating-conic-gradient(from 0deg,rgba(246,179,6,.22) 0deg 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 8%,transparent 62%);mask:radial-gradient(circle,#000 8%,transparent 62%);animation:spin 30s linear infinite}
.qrsec .star{position:absolute;left:50%;top:46%;width:420px;height:420px;margin:-210px 0 0 -210px;animation:pulse 3s ease-in-out infinite;opacity:.9}
.qrsec .qr{position:relative;display:inline-block;background:#fff;border-radius:20px;padding:16px;box-shadow:0 0 0 6px rgba(246,179,6,.9),0 0 60px 14px rgba(246,179,6,.45)}
.qrsec .qr canvas,.qrsec .qr img{display:block;width:min(240px,62vw);height:auto;image-rendering:pixelated}
.qrsec h3{position:relative;font:800 18px/1.3 Montserrat;margin-top:22px}
.qrsec p{position:relative;font:500 12.5px/1.5 Montserrat;opacity:.8;margin-top:6px}
#mute{position:fixed;right:14px;top:14px;z-index:72;width:44px;height:44px;border-radius:50%;border:0;background:rgba(27,35,64,.75);color:#fff;font-size:18px;display:none;cursor:pointer;backdrop-filter:blur(6px)}
#vid{position:fixed;inset:0;z-index:80;background:rgba(14,20,40,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px;text-align:center}
#vid canvas{height:min(62vh,560px);width:auto;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#1B2340}
#vid .pt{font:700 15px Montserrat;margin-top:16px}
#vid .pbar{width:min(320px,80vw);height:8px;border-radius:8px;background:rgba(255,255,255,.15);margin-top:12px;overflow:hidden}
#vid .pbar i{display:block;height:100%;width:0;background:var(--yel);transition:width .25s}
#vid .ps{font:500 12px/1.5 Montserrat;opacity:.7;margin-top:8px}
#vid .vb{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
#vid .vb .btn{padding:0 20px}
@media (min-width:720px){.hero h1{font-size:44px}.cname{font-size:40px}}
</style>
</head>
<body>
<header>
  <img class="leafbg" src="assets/registon-white.svg" alt="">
  <div class="wrap">
    <div class="top">
      <img src="assets/registon-white.svg" alt="Registan School">
      <div><div class="t1">REGISTAN SCHOOL</div><div class="t2">Monitoring bölimi</div></div>
    </div>
    <div class="hero" id="hero"></div>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">Yuklanmoqda…</div></main>
<footer>«Registon» va «Turkiston» taʼlim loyihalari · Monitoring bölimi<br>Har bir taşakkurnoma QR-kod orqali tekşiriladi</footer>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>
<button id="mute" aria-label="Ovoz">🔊</button>
<script src="assets/qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const OY = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentyabr","oktyabr","noyabr","dekabr"];
const sana = iso => { const [y,m,d] = iso.split("-").map(Number); return `${d}-${OY[m-1]}, ${y}`; };
const pad = n => String(n).padStart(4, "0");
const school = m => m === "turkiston" ? "Turkiston maktabi" : "Registon maktabi";
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("on"); setTimeout(()=>e.classList.remove("on"),2200); }
const norm = s => String(s||"").toLowerCase()
  .replace(/ş/g,"sh").replace(/ç/g,"ch").replace(/ğ/g,"g").replace(/ö/g,"o").replace(/[ʼ'`‘’]/g,"").replace(/h/g,"x");

/* ---------------- konfetti va emblem portlaşi ---------------- */
const cv = $("#fx"), cx = cv.getContext("2d");
let parts = [], raf = 0;
function fit(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", fit); fit();
function confetti(n, power){
  const C = ["#3955A1","#F6B306","#FFFFFF","#0D6D59","#8FA6E0"];
  const W = cv.width, H = cv.height, d = devicePixelRatio;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = (power * (0.4 + Math.random())) * d;
    parts.push({x: W/2, y: H*0.42, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 6*d, w: (6+Math.random()*7)*d, h: (9+Math.random()*9)*d,
                r: Math.random()*6, vr: (Math.random()-.5)*.4, c: C[i % C.length], life: 1});
  }
  if (!raf) loop();
}
function rain(n){
  const C = ["#3955A1","#F6B306","#0D6D59","#8FA6E0"], d = devicePixelRatio;
  for (let i = 0; i < n; i++) parts.push({x: Math.random()*cv.width, y: -20*d - Math.random()*cv.height*.4, vx: (Math.random()-.5)*2*d,
    vy: (2+Math.random()*3)*d, w: (5+Math.random()*6)*d, h: (8+Math.random()*8)*d, r: Math.random()*6, vr: (Math.random()-.5)*.3, c: C[i%C.length], life: 1});
  if (!raf) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  const d = devicePixelRatio;
  parts = parts.filter(p => p.y < cv.height + 40*d && p.life > 0);
  for (const p of parts){
    p.vy += 0.18*d; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    if (p.vy > 0) p.life -= 0.004;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.globalAlpha = Math.max(0, Math.min(1, p.life*1.5));
    cx.fillStyle = p.c; cx.fillRect(-p.w/2, -p.h/2, p.w, p.h * Math.abs(Math.cos(p.r*1.7))); cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(loop) : 0;
  if (!raf) cx.clearRect(0,0,cv.width,cv.height);
}
function leaves(n){
  const src = ["assets/registon-white.svg","assets/registon-yellow.svg","assets/registon.svg"];
  for (let i = 0; i < n; i++){
    const e = document.createElement("img"); e.src = src[i % 3]; e.className = "leafp";
    const a = (i / n) * Math.PI * 2 + Math.random()*.4, dist = 180 + Math.random()*Math.min(innerWidth, innerHeight)*.55;
    const s = .5 + Math.random()*1.3, rot = (Math.random()-.5)*720;
    document.body.appendChild(e);
    e.animate([
      {transform: "translate(-50%,-50%) scale(.2) rotate(0deg)", opacity: 1},
      {transform: `translate(calc(-50% + ${Math.cos(a)*dist}px), calc(-50% + ${Math.sin(a)*dist}px)) scale(${s}) rotate(${rot}deg)`, opacity: 1, offset: .7},
      {transform: `translate(calc(-50% + ${Math.cos(a)*dist*1.15}px), calc(-50% + ${Math.sin(a)*dist*1.15 + 120}px)) scale(${s*.9}) rotate(${rot*1.3}deg)`, opacity: 0}
    ], {duration: 1900 + Math.random()*700, easing: "cubic-bezier(.15,.8,.3,1)"}).onfinish = () => e.remove();
  }
  const r = document.createElement("div"); r.className = "ring"; document.body.appendChild(r); setTimeout(() => r.remove(), 1000);
}
let audio, fadeT;
function music(){
  try {
    audio = audio || new Audio("assets/taqdirlov.mp3");
    clearInterval(fadeT); audio.currentTime = 0; audio.volume = 1; audio.muted = false;
    audio.play().then(() => { const m = $("#mute"); m.style.display = "block"; m.textContent = "🔊"; }).catch(()=>{});
    audio.onended = () => { $("#mute").style.display = "none"; };
    fadeT = setInterval(() => { if (audio.duration && audio.currentTime > audio.duration - 2.5) audio.volume = Math.max(0, audio.volume - .08); }, 200);
  } catch(e){}
  if (navigator.vibrate) navigator.vibrate([60,40,120]);
}
function celebrate(full){
  if (full){
    music();
    const f = document.createElement("div"); f.className = "flash"; document.body.appendChild(f); setTimeout(() => f.remove(), 950);
    leaves(30); confetti(240, 14); setTimeout(() => rain(170), 600); setTimeout(() => confetti(130, 10), 1200); setTimeout(() => rain(90), 2600);
  } else { rain(70); }
}

/* ---------------- maʼlumot ---------------- */
let DATA = [];
async function load(){
  const r = await fetch("data/certs.json?t=" + Date.now(), {cache: "no-store"});
  DATA = (await r.json()).certs || [];
  izohlar();
}


/* ---------------- monitoring bölimi izohlari (4 bosqiç x 5) ---------------- */
const IZOH = [
 ["{ustoz}, bugungi darsingiz zör böldi! Öquvçilarning közidagi qiziqişni körib, biz ham quvondik. Rahmat sizga!",
  "Darsingizni kuzatib, vaqt qanday ötganini sezmay qoldik. Mana şunday darslar maktabni maktab qiladi. Tabriklaymiz, {ustoz}!",
  "Har bir daqiqasi öylangan, iliq va jonli dars böldi. Birinçi «Kun öqituvçisi» unvoningiz muborak bölsin!",
  "{ustoz}, darsingizda öquvçilar faqat tinglamadi — ular fikrladi, kuldi, izlandi. Bu katta mahorat. Rahmat!",
  "Bugun biz ajoyib darsning guvohi böldik. Bu faqat boşlaniş — yana köp şunday kunlarni kutib qolamiz!"],
 ["Yana siz, {ustoz}! Endi bu tasodif emasligini aniq bilamiz. Har safar darsingizdan yangi narsa olib ketamiz.",
  "Yana yuqori natija — bu mehnat, tayyorgarlik va yurakdan berilgan dars mahsuli. Ajoyib natija, bardavom böling!",
  "Darsingizni yana kuzatdik va yana xursand böldik. Öquvçilaringiz baxtli — ularga şunday ustoz nasib qilgan.",
  "{ustoz}, darslaringiz bizga ham ilhom beradi. Boşqa ustozlarga körsatadigan namunamiz köpayib boryapti — rahmat!",
  "Barqarorlik — eng qiyin narsa, siz esa uni qöldan bermayapsiz. Tabriklaymiz va yangi darslaringizni intiqlik bilan kutamiz!"],
 ["{ustoz}, rostini aytsak — biz ham sizdan ilm olamiz. Bugungi darsdan keyin öz daftarimizga ham bir nechta fikr yozib oldik.",
  "Bu sizning {n}-unvoningiz. Siz uçun «yaxşi dars» odatiy holga aylangan — biz esa har safar yangidan hayratlanamiz.",
  "Darsingiz boşqa ustozlar uçun ham tayyor namuna böla oladi. Şunday ustozlar bor ekan, maktabimiz kuçli!",
  "Mahorat, sabr va mehr — uçalasi ham darsingizda bor. Öquvçilar sizni nega bunçalik yaxşi körişini endi tuşunamiz.",
  "Har bir darsingiz kiçik bayramga aylanib bormoqda. Rahmat, {ustoz} — siz bilan birga işlaş biz uçun şaraf."],
 ["{ustoz}, siz maktabimizning faxrisiz. {n} marta «Kun öqituvçisi» — bu oddiy raqam emas, bu uzoq eslanadigan mehnat.",
  "Sizni kuzata turib, biz ham öz işimizga boşqaça qaray boşladik. Siz ustozlarning ustozi bölib qoldingiz. Çeksiz rahmat!",
  "Bunday natijani faqat çin yurakdan işlaydigan inson körsata oladi. Siz bilan faxrlanamiz va sizdan örganişda davom etamiz.",
  "{n}-marta! Har safar «bu safar ham zör bölarmikan?» deb darsga kiramiz — va har safar siz hayratda qoldirasiz. Ofarin, {ustoz}!",
  "Öquvçilaringiz sizni umr böyi eslaydi — buni bugungi darsning har bir lahzasida his qildik. Siz haqiqiy ustozsiz. Rahmat!"]
];
const tkey = ism => norm(ism).split(/\s+/).filter(Boolean).slice(0, 2).sort().join(" ");
function izohlar(){
  const cnt = {}, ctr = [0, 0, 0, 0];
  for (const c of [...DATA].sort((a, b) => a.n - b.n)){
    const k = tkey(c.ism); c.nth = cnt[k] = (cnt[k] || 0) + 1;
    const tier = c.nth === 1 ? 0 : c.nth <= 3 ? 1 : c.nth <= 6 ? 2 : 3;
    const w = c.ism.trim().split(/\s+/), ism1 = w[1] || w[0];
    c.izoh = IZOH[tier][ctr[tier]++ % 5].replace(/\{ustoz\}/g, ism1 + " ustoz").replace(/\{n\}/g, c.nth);
  }
}

/* ---------------- bitta taşakkurnoma ---------------- */
const SITE = location.origin + location.pathname;
function typeText(el, text, speed){
  el.textContent = ""; el.classList.add("caret"); let i = 0;
  const t = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length){ clearInterval(t); el.classList.remove("caret"); } }, speed);
}
function nameSpans(name){ return [...name].map((ch, i) => ch === " " ? " " : `<span style="animation-delay:${.35 + i*.045}s">${esc(ch)}</span>`).join(""); }
function drawQR(el, url){
  try {
    const q = qrcode(0, "M"); q.addData(url); q.make();
    const m = q.getModuleCount(), sc = 8, pad = 0, c = document.createElement("canvas");
    c.width = c.height = m*sc + pad*2; const x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.fillStyle = "#1B2340";
    for (let r = 0; r < m; r++) for (let k = 0; k < m; k++) if (q.isDark(r, k)) x.fillRect(pad + k*sc, pad + r*sc, sc, sc);
    el.appendChild(c);
  } catch(e){ el.parentElement.parentElement.style.display = "none"; }
}
const STAR = `<svg class="star" viewBox="0 0 100 100"><defs><radialGradient id="sg"><stop offset="0" stop-color="#FFF3C4"/><stop offset=".6" stop-color="#F6B306"/><stop offset="1" stop-color="#F6B306" stop-opacity="0"/></radialGradient></defs>
  <path fill="url(#sg)" opacity=".55" d="M50 2 L61 39 L98 50 L61 61 L50 98 L39 61 L2 50 L39 39Z"/>
  <path fill="url(#sg)" opacity=".35" transform="rotate(45 50 50)" d="M50 12 L58 42 L88 50 L58 58 L50 88 L42 58 L12 50 L42 42Z"/></svg>`;

function single(n){
  const c = DATA.find(x => x.n === n);
  if (!c){
    $("#hero").innerHTML = `<a class="back" href="./">← Barça taşakkurnomalar</a>`;
    $("#main").innerHTML = `<div class="empty">№ ${pad(n)} taşakkurnoma hozirça topilmadi.<br>Agar u bugun berilgan bölsa, bir necha daqiqadan keyin qayta oçing.</div>`;
    return;
  }
  document.title = `${c.ism} — Kun öqituvçisi`;
  const url = `${SITE}?n=${c.n}`;
  const stars = "★".repeat(Math.min(c.nth, 10)) + (c.nth > 10 ? " +" : "");
  $("#hero").innerHTML = `<a class="back" href="./">← Barça taşakkurnomalar</a>`;
  $("#main").innerHTML = `<div class="cert" id="cert">
    <div class="badge">✅ Haqiqiy taşakkurnoma · ${school(c.maktab)}</div>
    <div class="cname" id="cn">${esc(c.ism)}</div>
    <div class="cmeta"><b>${esc(c.filial)} filiali</b> · ${esc(c.fan)}<br>${sana(c.sana)} · № ${pad(c.n)}</div>
    <div class="unvon"><span class="st">${stars}</span><span>Bu ustozning ${c.nth}-«Kun öqituvçisi» unvoni</span></div>
    <div class="shot"><img src="${esc(c.img)}" alt="Taşakkurnoma № ${pad(c.n)}"></div>
    <div class="note"><div class="who"><img src="assets/registon-white.svg" alt=""><div>Registon monitoring bölimi<small>${sana(c.sana)}</small></div></div>
      <p id="izoh"></p><div class="sig">— Registon monitoring bölimi</div></div>
    <div class="btns">
      <button class="btn pri wide" id="video">🎬 Tabrik videosini yuklab oliş</button>
      <a class="btn" href="${esc(c.img)}" download="Kun-oqituvchisi-${pad(c.n)}.jpg">⬇️ Taşakkurnoma</a>
      <button class="btn" id="share">🔗 Ulaşiş</button>
      <button class="btn wide" id="again">🎉 Yana tabriklaş</button>
    </div>
    <div class="qrsec"><div class="burst"></div>${STAR}<div class="qr" id="qr"></div>
      <h3>Ushbu taşakkurnomaning QR kodi</h3><p>Skanerlang — taşakkurnoma va tabrik şu sahifada oçiladi</p></div>
  </div>`;
  drawQR($("#qr"), url);
  $("#again").onclick = () => { celebrate(true); typeText($("#izoh"), c.izoh, 28); };
  $("#video").onclick = () => makeVideo(c);
  $("#share").onclick = async () => {
    try { if (navigator.share) { await navigator.share({title: document.title, text: `«Kun öqituvçisi» — ${c.ism}`, url}); return; } } catch(e){ return; }
    try { await navigator.clipboard.writeText(url); toast("Havola nusxalandi"); } catch(e){ toast(url); }
  };
  const showFull = () => {
    $("#cert").classList.add("reveal");
    $("#cn").innerHTML = nameSpans(c.ism);
    setTimeout(() => typeText($("#izoh"), c.izoh, 30), 1700);
  };
  const key = "kun_seen_" + n;
  if (!store.get(key)){
    const g = document.createElement("div"); g.id = "gift";
    let sp = ""; for (let i = 0; i < 26; i++) sp += `<i class="spark" style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${(Math.random()*2.4).toFixed(2)}s"></i>`;
    g.innerHTML = `<div class="rays"></div>${sp}<div class="orb"><img src="assets/registon.svg" alt=""></div>
      <div class="k">SIZGA TABRIK BOR</div><h2>Hurmatli<b>${esc(c.ism)}</b></h2>
      <button class="open">🎁 Tabrikni oçing</button><div class="hint">Ovozni yoqing 🔊</div>`;
    document.body.appendChild(g);
    $("#izoh").textContent = "";
    g.querySelector(".open").onclick = () => {
      store.set(key, "1");
      g.classList.add("boom"); celebrate(true);
      setTimeout(() => { g.classList.add("hide"); showFull(); setTimeout(() => g.remove(), 800); }, 650);
    };
  } else {
    $("#izoh").textContent = c.izoh;
    setTimeout(() => celebrate(false), 300);
  }
}

/* ---------------- tabrik videosi (telefonning özida yasaladi) ---------------- */
function loadImg(src){ return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; }); }
function rng(seed){ return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function wrap(x, text, maxW){
  const words = text.split(" "), lines = []; let cur = "";
  for (const w of words){ const t = cur ? cur + " " + w : w; if (x.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
const ease = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
const clamp01 = t => Math.min(1, Math.max(0, t));

async function makeVideo(c){
  if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream){ toast("Bu brauzer video yasay olmaydi. Chrome yoki Safari'da oçing."); return; }
  const W = 1080, H = 1920, DUR = 20;
  const ov = document.createElement("div"); ov.id = "vid";
  ov.innerHTML = `<canvas width="${W}" height="${H}"></canvas><div class="pt">🎬 Video tayyorlanmoqda…</div><div class="pbar"><i></i></div>
    <div class="ps">20 soniya kuting, ekranni yopmang</div><div class="vb"></div>`;
  document.body.appendChild(ov);
  const cvv = ov.querySelector("canvas"), g = cvv.getContext("2d");
  let ac, stream, rec, stopAll = false;
  const fail = (m) => { stopAll = true; try { rec && rec.state !== "inactive" && rec.stop(); } catch(e){} ov.querySelector(".pt").textContent = m;
    ov.querySelector(".vb").innerHTML = `<button class="btn">Yopiş</button>`; ov.querySelector(".vb .btn").onclick = () => ov.remove(); };
  try {
    await document.fonts.load("800 80px Montserrat"); await document.fonts.load("500 40px Montserrat"); await document.fonts.load("300 60px Montserrat");
    const [cert, emb, embY] = await Promise.all([loadImg(c.img), loadImg("assets/registon-white.svg"), loadImg("assets/registon-yellow.svg")]);
    ac = new (window.AudioContext || window.webkitAudioContext)(); await ac.resume();
    const buf = await ac.decodeAudioData(await (await fetch("assets/taqdirlov.mp3")).arrayBuffer());
    const dest = ac.createMediaStreamDestination(), gain = ac.createGain(), srcN = ac.createBufferSource();
    srcN.buffer = buf; srcN.connect(gain); gain.connect(dest); gain.connect(ac.destination);
    gain.gain.setValueAtTime(1, ac.currentTime + DUR - 2.2); gain.gain.linearRampToValueAtTime(0, ac.currentTime + DUR);
    stream = new MediaStream([...cvv.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
    const types = ['video/mp4;codecs="avc1.42E01E,mp4a.40.2"', 'video/mp4;codecs="avc1,mp4a"', "video/mp4;codecs=avc1", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"];
    const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(stream, mime ? {mimeType: mime, videoBitsPerSecond: 6000000} : {videoBitsPerSecond: 6000000});
    const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      try { srcN.stop(); ac.close(); } catch(e){}
      if (stopAll && !chunks.length) return;
      const type = (rec.mimeType || mime || "video/webm").split(";")[0], ext = type.includes("mp4") ? "mp4" : "webm";
      const blob = new Blob(chunks, {type}), name = `Kun-oqituvchisi-${pad(c.n)}.${ext}`, href = URL.createObjectURL(blob);
      ov.querySelector(".pt").textContent = "✅ Video tayyor!"; ov.querySelector(".pbar i").style.width = "100%";
      ov.querySelector(".ps").textContent = `${(blob.size/1048576).toFixed(1)} MB · ${ext.toUpperCase()}`;
      const file = new File([blob], name, {type});
      const canShare = navigator.canShare && navigator.canShare({files: [file]});
      ov.querySelector(".vb").innerHTML = `<a class="btn pri" href="${href}" download="${name}">⬇️ Saqlaş</a>${canShare ? `<button class="btn" id="vs">📤 Ulaşiş</button>` : ""}<button class="btn" id="vx">Yopiş</button>`;
      if (canShare) ov.querySelector("#vs").onclick = () => navigator.share({files: [file], title: "Kun öqituvçisi"}).catch(()=>{});
      ov.querySelector("#vx").onclick = () => { URL.revokeObjectURL(href); ov.remove(); };
    };
    // ---- sahna ----
    const R = rng(c.n * 977 + 13), P = [];
    const COLS = ["#F6B306", "#FFFFFF", "#8FA6E0", "#0D6D59", "#FFE7A3"];
    for (let i = 0; i < 260; i++){ const a = R()*Math.PI*2, v = 9 + R()*26;
      P.push({x: W/2, y: 760, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 14, w: 12 + R()*16, h: 18 + R()*18, r: R()*6, vr: (R()-.5)*.35, c: COLS[i % 5]}); }
    const RAIN = []; for (let i = 0; i < 120; i++) RAIN.push({x: R()*W, y: -R()*H, v: 4 + R()*6, w: 10 + R()*12, h: 16 + R()*14, r: R()*6, vr: (R()-.5)*.2, c: COLS[i % 5]});
    const lines = (() => { g.font = "500 44px Montserrat"; return wrap(g, c.izoh, 860); })();
    const nameL = (() => { let fs = 92; g.font = `800 ${fs}px Montserrat`; let L = wrap(g, c.ism.toUpperCase(), 980);
      while ((L.length > 2 || L.some(l => g.measureText(l).width > 980)) && fs > 56){ fs -= 4; g.font = `800 ${fs}px Montserrat`; L = wrap(g, c.ism.toUpperCase(), 980); } return {L, fs}; })();
    const cw = 940, ch = cw * cert.naturalHeight / cert.naturalWidth;
    let lastT = 0;
    function frame(t){
      const dt = Math.min(.1, t - lastT); lastT = t;
      // fon
      const bg = g.createRadialGradient(W/2, 700, 50, W/2, 900, 1300); bg.addColorStop(0, "#2C4590"); bg.addColorStop(.55, "#1B2340"); bg.addColorStop(1, "#0E1428");
      g.fillStyle = bg; g.fillRect(0, 0, W, H);
      g.save(); g.translate(W/2, 760); g.rotate(t * .12);
      for (let i = 0; i < 24; i++){ g.rotate(Math.PI*2/24); g.fillStyle = "rgba(246,179,6,0.07)"; g.beginPath(); g.moveTo(0,0); g.lineTo(-70, -1400); g.lineTo(70, -1400); g.closePath(); g.fill(); }
      g.restore();
      // 0–2.4 s: emblem
      const e1 = ease(t / 1.4), e2 = ease((t - 2.4) / 1.0);
      const es = (0.6 + 0.4*e1) * (1 - 0.55*e2), ey = 760 - 560*e2;
      g.save(); g.globalAlpha = e1; g.shadowColor = "rgba(246,179,6,.9)"; g.shadowBlur = 80;
      const ew = 360*es, eh = ew * 172/241; g.drawImage(t < 2.4 ? emb : embY, W/2 - ew/2, ey - eh/2, ew, eh); g.restore();
      if (t < 2.6){ g.save(); g.globalAlpha = clamp01(t - .6) * (1 - clamp01((t - 2.2)/.4)); g.fillStyle = "#F6B306"; g.font = "700 46px Montserrat"; g.textAlign = "center";
        g.fillText("T A B R I K L A Y M I Z", W/2, 1060); g.fillStyle = "#fff"; g.font = "300 54px Montserrat"; g.fillText("Hurmatli ustoz", W/2, 1150); g.restore(); }
      // 2.4 s: çaqnaş
      if (t > 2.4 && t < 3.3){ g.fillStyle = `rgba(255,255,255,${(1 - (t-2.4)/.9)*.85})`; g.fillRect(0, 0, W, H); }
      // taşakkurnoma
      const k = ease((t - 2.6) / 1.4);
      if (t > 2.6){
        g.save(); g.translate(W/2, 640 + (1-k)*500); g.rotate((1-k) * -.12); g.scale(.75 + .25*k, .75 + .25*k); g.globalAlpha = k;
        g.shadowColor = "rgba(246,179,6,.75)"; g.shadowBlur = 70 + 30*Math.sin(t*3);
        g.fillStyle = "#fff"; g.fillRect(-cw/2 - 8, -ch/2 - 8, cw + 16, ch + 16); g.shadowBlur = 0;
        g.drawImage(cert, -cw/2, -ch/2, cw, ch); g.restore();
      }
      // ism
      const kn = ease((t - 3.6) / 1.0);
      if (t > 3.6){
        g.save(); g.globalAlpha = kn; g.textAlign = "center";
        let y = 1080 + (1-kn)*40; g.fillStyle = "#F6B306"; g.font = "700 36px Montserrat"; g.fillText("«KUN ÖQITUVÇISI»", W/2, y); y += 30;
        g.fillStyle = "#fff"; g.font = `800 ${nameL.fs}px Montserrat`;
        for (const l of nameL.L){ y += nameL.fs * 1.05; g.fillText(l, W/2, y); }
        y += 58; g.font = "500 34px Montserrat"; g.fillStyle = "rgba(255,255,255,.8)";
        g.fillText(`${c.filial} filiali · ${c.fan}`, W/2, y); y += 46; g.fillText(`${sana(c.sana)} · № ${pad(c.n)}`, W/2, y);
        g.fillStyle = "#F6B306"; g.font = "700 34px Montserrat"; y += 56; g.fillText(`${"★".repeat(Math.min(c.nth, 10))}  ${c.nth}-unvon`, W/2, y);
        g.restore();
      }
      // izoh
      if (t > 7.5){
        const ki = ease((t - 7.5) / .8), cy = 1460 + (1-ki)*60, bh = 130 + lines.length*60;
        g.save(); g.globalAlpha = ki; g.fillStyle = "rgba(255,255,255,.96)";
        g.beginPath(); g.roundRect ? g.roundRect(70, cy, W - 140, bh, 34) : g.rect(70, cy, W - 140, bh); g.fill();
        g.fillStyle = "#3955A1"; g.font = "700 32px Montserrat"; g.textAlign = "left"; g.fillText("💬 Registon monitoring bölimi", 110, cy + 62);
        const total = c.izoh.length, shown = Math.floor(clamp01((t - 8.3) / 6.5) * total);
        g.fillStyle = "#1B2340"; g.font = "500 44px Montserrat"; let left = shown;
        lines.forEach((l, i) => { if (left <= 0) return; g.fillText(l.slice(0, left), 110, cy + 128 + i*60); left -= l.length + 1; });
        g.restore();
      }
      // konfetti
      if (t > 2.4){ const st = (t - 2.4);
        for (const p of P){ if (st > 6) break; p.vy += 0.6; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
          g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w/2, -p.h/2, p.w, p.h*Math.abs(Math.cos(p.r*1.7))); g.restore(); } }
      if (t > 4){ for (const p of RAIN){ p.y += p.v * (dt*60); p.r += p.vr; if (p.y > H + 40) p.y = -40;
          g.save(); g.globalAlpha = .85; g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w/2, -p.h/2, p.w, p.h*Math.abs(Math.cos(p.r*1.7))); g.restore(); } }
      // pastki yozuv
      g.save(); g.globalAlpha = .75; g.fillStyle = "#fff"; g.font = "600 28px Montserrat"; g.textAlign = "center";
      g.fillText("REGISTAN SCHOOL · MONITORING BÖLIMI", W/2, H - 70); g.restore();
      // oxiri
      if (t > DUR - 1.2){ g.fillStyle = `rgba(14,20,40,${clamp01((t - DUR + 1.2)/1.2)})`; g.fillRect(0, 0, W, H); }
    }
    frame(0);
    rec.start(500); srcN.start();
    const t0 = performance.now();
    const tick = () => {
      if (stopAll) return;
      const t = (performance.now() - t0) / 1000;
      frame(Math.min(t, DUR));
      ov.querySelector(".pbar i").style.width = `${Math.min(100, t / DUR * 100)}%`;
      if (t >= DUR){ rec.stop(); return; }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  } catch(e){ console.error(e); fail("Video yasab bölmadi 😔 Boşqa brauzerda urinib köring."); }
}
